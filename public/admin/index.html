<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration – Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-bg {
      position: fixed; inset: 0; z-index: -1;
      background: var(--bg);
      overflow: hidden;
    }

    .login-bg::before {
      content: '';
      position: absolute; top: 20%; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .login-card {
      width: 100%; max-width: 420px;
      padding: 48px 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.5s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-icon {
      width: 64px; height: 64px;
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--accent-light);
      margin: 0 auto 16px;
    }

    .login-title { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 0.88rem; color: var(--text-muted); text-align: center; }

    .login-form { display: flex; flex-direction: column; gap: 20px; margin-top: 32px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }

    .password-wrapper { position: relative; }
    .password-wrapper input { width: 100%; padding-right: 44px; }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 0.95rem;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--text); }

    .login-error {
      display: none;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #f85149;
      text-align: center;
    }

    .login-btn { width: 100%; font-size: 1rem; padding: 14px; }

    .login-back {
      text-align: center;
      margin-top: 20px;
    }

    .login-back a {
      color: var(--text-muted);
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .login-back a:hover { color: var(--accent-light); }
  </style>
</head>
<body>
  <div class="login-bg"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-icon"><i class="fa-solid fa-lock"></i></div>
      <h1 class="login-title">Administration</h1>
      <p class="login-sub">Portfolio BTS CIO – SISR</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="login-error" id="loginError"></div>

      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Entrez le mot de passe" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" onclick="togglePw()">
            <i class="fa-solid fa-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i>
        Se connecter
      </button>
    </form>

    <div class="login-back">
      <a href="/"><i class="fa-solid fa-arrow-left"></i> Retour au portfolio</a>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('admin_token')) {
      fetch('/api/admin/verify', { headers: { Authorization: `Bearer ${localStorage.getItem('admin_token')}` } })
        .then(r => r.ok ? window.location.href = '/admin/dashboard' : localStorage.removeItem('admin_token'))
        .catch(() => {});
    }

    function togglePw() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pwIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('loginError');
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';
      error.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin/dashboard';
        } else {
          error.textContent = data.error || 'Erreur de connexion';
          error.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
        }
      } catch {
        error.textContent = 'Impossible de contacter le serveur';
        error.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
      }
    });
  </script>
</body>
</html>
